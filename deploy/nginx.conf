# Qlip derriere nginx + PHP-FPM. Le document root est public/.
#
#   nginx -t && systemctl reload nginx
#
# Les variables d'environnement ne se posent pas avec SetEnv ici : mettez-les dans le pool
# PHP-FPM (clear_env = no, env[QLIP_BASE_URL] = https://qlip.tigro.fr), ou en fastcgi_param
# -- l'app lit getenv(), $_SERVER et $_ENV.

server {
    server_name qlip.tigro.fr;
    root /opt/WebSites/qlip.tigro.fr/public;

    # Tout ce qui n'est pas un fichier ou un dossier reel part au front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    }

    # Assets : Apache ou nginx les sert directement, l'app ne les connait pas.
    location /assets/ {
        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
