# Qlip derriere Apache + PHP-FPM. Le document root est public/ : src/, templates/, data/
# et var/ restent hors du document root.
#
#   a2enmod rewrite env proxy_fcgi headers ssl
#   apache2ctl configtest && systemctl reload apache2
#
# PutEnv n'est pas une directive Apache et ne fonctionne pas avec PHP-FPM : SetEnv passe
# par l'environnement FastCGI, donc dans $_SERVER. L'app lit getenv(), $_SERVER et
# REDIRECT_* (le prefixe apparait quand la requete est reecrite).

<VirtualHost *:443>
    ServerName qlip.example.com

    DocumentRoot /var/www/qlip/public

    # RewriteBase est une directive de contexte par repertoire : elle n'a rien a faire
    # dans un VirtualHost.

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Le bloc Directory doit porter le meme chemin que le DocumentRoot, sinon Apache
    # retombe sur le <Directory /> global (Require all denied) et repond 403 avant
    # meme d'appeler PHP. Le 403 d'Apache se reconnait a son charset iso-8859-1 et
    # a l'absence de CSP ; celui de l'app est en utf-8 avec la CSP.
    #
    # La reecriture doit etre dans le meme contexte que le DocumentRoot : dans le contexte
    # par serveur (le VirtualHost), %{REQUEST_FILENAME} peut n'etre que l'URI, sans
    # DocumentRoot. Le test !-f ne voit alors aucun fichier reel du site, et les assets
    # partent au front controller au lieu d'etre servis. Dans le contexte par repertoire,
    # le chemin est resolu en entier et le test fonctionne.
    <Directory /var/www/qlip/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        # Tout ce qui n'est pas un fichier ou un dossier reel part au front controller.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Variables de l'app. Avec PHP-FPM, il faut aussi clear_env = no dans le pool pour
    # que getenv() voie quelque chose ; $_SERVER suffit dans tous les cas.
    SetEnv QLIP_BASE_URL https://qlip.example.com
    SetEnv QLIP_RP_ID qlip.example.com
    SetEnv QLIP_ORIGINS https://qlip.example.com
    SetEnv QLIP_SECURE_COOKIES 1
    SetEnv QLIP_ADMIN_EMAILS admin@qlip.example.com

    # Transport email. Par defaut l'app ecrit dans var/outbox ; pour un envoi reel il faut
    # smtp (client ecrit a la main, TLS implicite sur 465, certificat verifie). Ces lignes
    # ne sont pas remplacees par les vrais identifiants dans le depot : elles donnent la
    # forme, a recopier dans la conf reelle du vhost.
    # SetEnv QLIP_MAIL_TRANSPORT smtp
    # SetEnv QLIP_SMTP_HOST smtp.example.com
    # SetEnv QLIP_SMTP_PORT 465
    # SetEnv QLIP_SMTP_USER identifiant
    # SetEnv QLIP_SMTP_PASS mot-de-passe
    # SetEnv QLIP_SMTP_FROM identifiant
    # SetEnv QLIP_SMTP_CAFILE /etc/ssl/certs/ca-certificates.crt
    # Le nom donne a EHLO doit etre celui du serveur, pas localhost : certains fournisseurs
    # refusent l authentification sinon. L adresse d envoi doit etre la boite authentifiee.
    # SetEnv QLIP_SMTP_HELLO qlip.example.com

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/qlip.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qlip.example.com/privkey.pem
</VirtualHost>
