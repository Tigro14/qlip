# Qlip derriere Apache + PHP-FPM. Le document root est public/ : src/, templates/, data/
# et var/ restent hors du document root.
#
#   a2enmod rewrite env proxy_fcgi headers ssl
#   apache2ctl configtest && systemctl reload apache2
#
# PutEnv n'est pas une directive Apache et ne fonctionne pas avec PHP-FPM : SetEnv passe
# par l'environnement FastCGI, donc dans $_SERVER. L'app lit getenv(), $_SERVER et
# REDIRECT_* (le prefixe apparait quand la requete est reecrite).

<VirtualHost *:443>
    ServerName qlip.tigro.fr

    DocumentRoot /opt/WebSites/qlip.tigro.fr/public

    # Tout ce qui n'est pas un fichier ou un dossier reel part au front controller.
    # RewriteBase est une directive de contexte par repertoire : elle n'a rien a faire
    # dans un VirtualHost.
    RewriteEngine On
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /opt/WebSites/qlip.tigro.fr/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Variables de l'app. Avec PHP-FPM, il faut aussi clear_env = no dans le pool pour
    # que getenv() voie quelque chose ; $_SERVER suffit dans tous les cas.
    SetEnv QLIP_BASE_URL https://qlip.tigro.fr
    SetEnv QLIP_RP_ID qlip.tigro.fr
    SetEnv QLIP_ORIGINS https://qlip.tigro.fr
    SetEnv QLIP_SECURE_COOKIES 1
    SetEnv QLIP_ADMIN_EMAILS admin@qlip.tigro.fr

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/qlip.tigro.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qlip.tigro.fr/privkey.pem
</VirtualHost>
